<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1320"><title>Ціна одного рішення</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f3f6fb;background:#08111d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 60% 0%,#25364d 0%,#0b1421 52%,#070d16 100%)}main{max-width:620px;margin:auto;padding:22px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;color:#b5c4d7;font-size:12px;letter-spacing:1px}.brand{color:#e4bb79;font-weight:800}.scene{margin-top:24px;border:1px solid #3c4a5e;border-radius:20px;overflow:hidden;background:#111d2c;box-shadow:0 20px 60px #0007}.visual{height:215px;position:relative;display:flex;align-items:end;padding:22px;background:linear-gradient(0deg,#0c1623 0%,transparent 80%),radial-gradient(circle at 72% 34%,#8b9aaa77,transparent 29%),linear-gradient(115deg,#1d2c3b 10%,#394a5c 48%,#142031 49%,#263548 100%)}.visual:before{content:"";position:absolute;right:14%;top:23%;width:90px;height:130px;border-radius:48% 48% 10% 10%;background:linear-gradient(#1c2735 30%,#111b29 30%);box-shadow:0 12px 30px #0007;opacity:.8}.visual span{position:relative;z-index:1;font-size:12px;background:#0c1628d9;padding:7px 10px;border-radius:6px;letter-spacing:1px}.content{padding:24px}h1{font-size:30px;line-height:1.12;margin:0 0 12px}h2{font-size:23px;line-height:1.2;margin:0 0 14px}p{font-size:16px;line-height:1.6;color:#d6dfec;white-space:pre-line}.small{font-size:12px;color:#9caec5}.options{display:grid;gap:11px;margin-top:22px}button{border:1px solid #536781;border-radius:12px;background:#1b2b40;color:white;text-align:left;padding:16px;font-size:15px;font-weight:650;line-height:1.4;cursor:pointer}button:active{background:#38506c}button.primary{background:#bd9256;border-color:#bd9256;color:#0d1420;text-align:center}footer{margin-top:18px;color:#8396af;font-size:12px;line-height:1.5}.progress{height:4px;background:#253449;border-radius:4px;margin-top:18px;overflow:hidden}.bar{height:100%;background:#d4ac71;transition:width .2s}.tag{color:#e3b87b;font-size:12px;letter-spacing:1.2px;font-weight:800;margin-bottom:10px}.note{border-left:3px solid #bd9256;padding-left:13px;color:#d8e2ed}.reset{margin-top:16px;background:transparent;border-color:#43536a;text-align:center;width:100%}</style></head><body><main><div class="top"><span class="brand">ЦІНА ОДНОГО РІШЕННЯ</span><span id="counter">ЕПІЗОД 01</span></div><div class="progress"><div class="bar" id="bar"></div></div><section class="scene"><div class="visual"><span id="place">08:47 · СЛУЖБОВИЙ КАБІНЕТ</span></div><div class="content"><div class="tag" id="tag">ІНТЕРАКТИВНА ІСТОРІЯ</div><h1 id="title">Невинне прохання</h1><p id="story"></p><div class="options" id="options"></div></div></section><footer>Вигадана навчальна історія. Не містить реальних службових даних. Юридичні висновки потребують перевірки за чинним законодавством України.</footer></main><script>
const scenes={start:{tag:'ЕПІЗОД 01 · ПРОЛОГ',title:'Невинне прохання',place:'08:47 · СЛУЖБОВИЙ КАБІНЕТ',text:'Звичайний понеділок. Ти щойно прийшов на службу. На столі — документи, поруч блимає телефон.\n\nСьогоднішнє рішення може змінити значно більше, ніж здається.',options:[['Розпочати історію','call']]},call:{tag:'СЦЕНА 01 · ДЗВІНОК',title:'«Це ж між нами…»',place:'08:51 · ВХІДНИЙ ДЗВІНОК',text:'Телефонує давній знайомий.\n\n«Мені треба дізнатися адресу однієї людини. Ти ж можеш подивитися в службовій базі. Нічого такого — просто допоможи».\n\nВін просить не розповідати нікому про дзвінок.',options:[['Відмовити у використанні службової бази для приватного прохання','refuse'],['Запитати, навіщо йому ця адреса','ask'],['Погодитися перевірити інформацію','lookup']]},ask:{tag:'СЦЕНА 02 · ТИСК',title:'«Ти мені не довіряєш?»',place:'08:54 · ТЕЛЕФОННА РОЗМОВА',text:'Знайомий дратується: «Там особиста справа. Не роби з цього проблему. Я ж не чужий».\n\nТепер прохання звучить ще наполегливіше.',options:[['Чітко відмовити та завершити розмову','refuse'],['Запропонувати звернутися законним шляхом','safe'],['Все-таки перевірити базу','lookup']]},refuse:{tag:'СЦЕНА 02 · НАСЛІДОК',title:'Межа встановлена',place:'09:02 · КОРИДОР',text:'Ти пояснюєш, що службові повноваження не можна використовувати для приватних запитів. Знайомий незадоволений, але розмова закінчується.\n\nЗа кілька хвилин надходить повідомлення: «Ну, я зрозумів…»',options:[['Зберегти повідомлення та оцінити потребу повідомити керівництво','goodend'],['Видалити повідомлення й забути про ситуацію','quietend']]},safe:{tag:'СЦЕНА 03 · АЛЬТЕРНАТИВА',title:'Законний шлях',place:'09:05 · СЛУЖБОВИЙ КАБІНЕТ',text:'Ти не розкриваєш жодних даних і пояснюєш, що особисті питання потрібно вирішувати через передбачені законом процедури.\n\nЗнайомий кладе слухавку. Рішення залишилося за тобою.',options:[['Завершити епізод','goodend']]},lookup:{tag:'СЦЕНА 02 · ПОМИЛКА',title:'Один пошуковий запит',place:'08:58 · РОБОЧЕ МІСЦЕ',text:'Ти відкриваєш службову систему без службової потреби. Запит залишає цифровий слід.\n\nЗнайомий одразу пише: «Ну що, знайшов?»',options:[['Не передавати інформацію, припинити дії та повідомити про інцидент установленим порядком','reportend'],['Надіслати йому адресу','badend']]},goodend:{end:true,tag:'ФІНАЛ · ВІДПОВІДАЛЬНЕ РІШЕННЯ',title:'Ти зберіг межу',place:'ФІНАЛ 01 · ДОБРОЧЕСНІСТЬ',text:'Ти не використав службовий доступ для приватної мети. Твоя відмова захистила персональні дані й довіру до служби.\n\nНавчальний висновок: особисті стосунки не створюють законної підстави для доступу до службової інформації.'},quietend:{end:true,tag:'ФІНАЛ · НЕЗАКРИТЕ ПИТАННЯ',title:'Рішення без продовження',place:'ФІНАЛ 02 · ОБАЧНІСТЬ',text:'Ти не розголосив дані, але не оцінив, чи потребує ситуація документування або повідомлення за внутрішніми правилами.\n\nНавчальний висновок: важливо знати порядок реагування на неправомірні прохання у своєму підрозділі.'},reportend:{end:true,tag:'ФІНАЛ · ВИПРАВЛЕННЯ',title:'Зупинитися — теж рішення',place:'ФІНАЛ 03 · РЕАГУВАННЯ',text:'Ти припинив несанкціоновані дії, не передав дані та ініціював належне повідомлення. Це не скасовує факту необґрунтованого доступу, але дозволяє належно оцінити інцидент.\n\nНавчальний висновок: службовий доступ має використовуватися лише за належною підставою.'},badend:{end:true,tag:'ФІНАЛ · НЕБЕЗПЕЧНИЙ ВИБІР',title:'Ціна однієї адреси',place:'ФІНАЛ 04 · НАСЛІДКИ',text:'Ти передав персональні дані сторонній людині. Згодом виникають питання щодо законності доступу та розголошення. Можливі наслідки залежать від обставин і правової кваліфікації.\n\nНавчальний висновок: навіть «дружнє прохання» не виправдовує неправомірне використання службових відомостей.'}};
let current=localStorage.getItem('corruption-game-scene')||'start';if(!scenes[current])current='start';function render(id){current=id;localStorage.setItem('corruption-game-scene',id);const s=scenes[id];document.getElementById('tag').textContent=s.tag;document.getElementById('title').textContent=s.title;document.getElementById('story').textContent=s.text;document.getElementById('place').textContent=s.place;document.getElementById('counter').textContent=s.end?'ФІНАЛ':'ЕПІЗОД 01';document.getElementById('bar').style.width=s.end?'100%':id==='start'?'10%':id==='call'?'28%':'65%';const o=document.getElementById('options');o.innerHTML='';(s.options||[]).forEach(([label,next])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>render(next);o.appendChild(b)});if(s.end){const b=document.createElement('button');b.className='primary';b.textContent='Зіграти ще раз · побачити інший фінал';b.onclick=()=>render('start');o.appendChild(b)}window.scrollTo({top:0,behavior:'smooth'})}render(current);
</script></body></html>

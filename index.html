function go(step){state.step=step;save();render();window.scrollTo(0,0)}
function choose(g){if(state.gender&&state.gender!==g&&state.choice!==null){if(!confirm('Змінити героя? Для нового персонажа історія почнеться спочатку.'))return;state=initial()}state.gender=g;go('episodes')}

ий звіт</button><button class="btn secondary" style="margin-top:10px" onclick="episodeMenu()">Назад до меню</button></section>`}}

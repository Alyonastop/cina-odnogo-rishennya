:root{color-scheme:dark;--bg:#080f1b;--panel:#101c2d;--muted:#9daec2;--gold:#eac18a;--line:#314055}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#23364e 0,#080f1b 63%);font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f2f5fa;min-height:100dvh}.shell{max-width:540px;margin:auto;min-height:100dvh;padding:18px 16px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 17px}.brand{font-size:11px;letter-spacing:.19em;color:var(--gold);font-weight:800}.pill{border:1px solid #43546b;color:#c2cede;border-radius:20px;padding:6px 10px;font-size:11px}.progress{height:3px;background:#27374b;border-radius:10px;margin-bottom:17px;overflow:hidden}.progress>div{height:100%;background:var(--gold);transition:width .35s}.hero{position:relative;min-height:260px;overflow:hidden;border-radius:18px 18px 0 0;background:#172438}.art{position:absolute;inset:0;width:100%;height:100%}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 15%,rgba(5,11,20,.25) 42%,#0b1524 100%)}.heroMeta{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;gap:8px;align-items:end}.heroMeta span{font-size:10px;letter-spacing:.16em;font-weight:700;color:#fff;background:#0a1422aa;padding:7px 9px;border:1px solid #ffffff2c;border-radius:4px}.card{background:linear-gradient(160deg,#152438,#101a2a);border:1px solid #3a4b61;border-top:0;border-radius:0 0 18px 18px;padding:25px 22px 24px;box-shadow:0 18px 65px #0006}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.title{font-size:clamp(27px,7vw,36px);line-height:1.13;letter-spacing:-.035em;margin:13px 0 18px}.story{white-space:pre-line;color:#d9e2ec;font-size:16px;line-height:1.75}.dialogue{border-left:2px solid var(--gold);padding:12px 16px;margin:18px 0;background:#ffffff09;color:#fff}.speaker{color:var(--gold);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:5px}.choices{display:grid;gap:11px;margin-top:23px}.choice{width:100%;background:#1a2c42;border:1px solid #4b627d;color:#f5f7fa;text-align:left;padding:15px 16px;border-radius:11px;font:600 15px/1.5 inherit;cursor:pointer;transition:.15s}.choice:active{transform:scale(.985);background:#30445b}.choice small{display:block;color:#aab9cb;font-weight:400;margin-top:3px}.primary{background:var(--gold);color:#121b27;border-color:var(--gold);text-align:center;font-weight:800}.footer{font-size:11px;color:#8393a7;line-height:1.65;margin:21px 5px}.evidence{border:1px solid #7b6648;background:#251f1a;border-radius:12px;padding:14px 16px;margin:20px 0}.evidence strong{font-size:12px;letter-spacing:.13em;color:var(--gold)}.evidence p{margin:7px 0 0;color:#eadbc6;font-size:14px}.tag{display:inline-block;border:1px solid #61728a;border-radius:30px;padding:5px 9px;font-size:11px;color:#cbd7e6;margin:4px 5px 0 0}.mute{color:var(--muted)}.tiny{font-size:12px}.restart{border:0;background:none;color:var(--gold);font-size:12px;cursor:pointer;padding:8px 0}button:focus-visible{outline:2px solid #fff;outline-offset:3px}@media(min-width:550px){.shell{padding-top:24px}.hero{min-height:310px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">ЦІНА ОДНОГО РІШЕННЯ</div><div class="pill" id="chapter">ІНТЕРАКТИВНИЙ ТРИЛЕР</div></header><div class="progress"><div id="bar" style="width:4%"></div></div><section class="hero"><svg class="art" viewBox="0 0 520 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="wall" x2="1" y2="1"><stop stop-color="#3c5163"/><stop offset="1" stop-color="#0a1626"/></linearGradient><linearGradient id="light" x1="0" x2="1"><stop stop-color="#edc08a" stop-opacity=".6"/><stop offset="1" stop-color="#edc08a" stop-opacity="0"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="15"/></filter></defs><rect width="520" height="320" fill="url(#wall)"/><path d="M0 0H520V95L290 320H0Z" fill="#22354a"/><path d="M305 0H520V210L330 320H190Z" fill="url(#light)" opacity=".5"/><rect x="35" y="25" width="140" height="155" rx="3" fill="#101d2c" stroke="#6d7e8b" stroke-width="5"/><path d="M105 25V180M35 100H175" stroke="#6d7e8b" stroke-width="4"/><rect x="47" y="35" width="116" height="130" fill="#a1b6b5" opacity=".2"/><path d="M35 180L0 260H300L170 180Z" fill="#edc08a" opacity=".12"/><rect x="0" y="232" width="520" height="88" fill="#111c2b"/><path d="M0 232H520" stroke="#526579" stroke-width="4"/><path d="M45 232L82 195H400L465 232Z" fill="#25374a"/><rect x="110" y="202" width="104" height="14" rx="2" fill="#c9c4b7" transform="rotate(-5 110 202)"/><rect x="215" y="198" width="85" height="18" rx="2" fill="#d2d0c5" transform="rotate(4 215 198)"/><rect x="332" y="184" width="47" height="34" rx="5" fill="#060d16" stroke="#506174" stroke-width="2"/><rect x="340" y="189" width="31" height="23" rx="2" fill="#29475a"/><circle cx="354" cy="201" r="5" fill="#eac18a" opacity=".7"/><ellipse cx="445" cy="170" rx="49" ry="81" fill="#081322" opacity=".9"/><circle cx="445" cy="99" r="32" fill="#101d2b"/><path d="M400 154Q445 120 488 154L506 255H380Z" fill="#142439"/><path d="M410 155H480" stroke="#34475a" stroke-width="2"/><circle cx="455" cy="55" r="58" fill="#eac18a" opacity=".08" filter="url(#blur)"/></svg><div class="shade"></div><div class="heroMeta"><span id="place">08:47 · СЛУЖБОВИЙ КАБІНЕТ</span><span id="status">СПРАВА 001</span></div></section><section class="card" id="content" aria-live="polite"></section><div class="footer">Художня навчальна симуляція. Усі персонажі й події вигадані. Не вводьте реальні персональні чи службові дані. Правові пояснення потребують перевірки за чинними нормами України.</div></main><script>
const scenes={intro:{chapter:'ПРОЛОГ',title:'Невинне прохання',place:'08:47 · СЛУЖБОВИЙ КАБІНЕТ',body:'Понеділок. Ти щойно прийшов на службу. На столі — документи, поруч блимає телефон.\n\nОдин дзвінок може змінити значно більше, ніж здається.',options:[['Розпочати історію','call','primary']]},call:{chapter:'СЦЕНА 01',title:'Знайомий номер',place:'08:49 · ВХІДНИЙ ДЗВІНОК',body:'Телефонує давній знайомий. Ви давно не спілкувалися. Голос звучить дружньо, але він швидко переходить до справи.',speaker:'Знайомий',quote:'«Мені потрібно перевірити одну людину. Ти ж маєш доступ до службової інформації. Просто глянь, ніхто не дізнається».',options:[['Попросити пояснити, навіщо йому інформація','why'],['Відразу відмовитися від неслужбового запиту','refuse'],['Погодитися перевірити дані','lookup'],['Порадити офіційний порядок отримання інформації','route'],['Попросити колегу перевірити замість себе','delegate'],['Запитати, чи є документована службова підстава','basis']]},why:{chapter:'СЦЕНА 02',title:'Тиск довірою',place:'08:51 · ТЕЛЕФОННА РОЗМОВА',body:'Знайомий зітхає. Його прохання стає наполегливішим.',speaker:'Знайомий',quote:'«Ти мене знаєш десять років. Я ж не прошу нічого поганого. Це особисте».',options:[['Пояснити, що особисті причини не дають права на доступ','refuse'],['Запропонувати звернутися законним шляхом','route'],['Зробити виняток «лише цього разу»','lookup'],['Попросити колегу перевірити інформацію','delegate'],['Попросити офіційно сформулювати запит','basis']]},refuse:{chapter:'СЦЕНА 03',title:'Незручна пауза',place:'08:53 · СЛУЖБОВИЙ КАБІНЕТ',body:'Ти відмовляєшся використовувати службовий доступ для приватного прохання. У слухавці западає тиша. За хвилину приходить нове повідомлення.',evidence:'«Добре. Тільки не роби з цього проблеми. Я ж просто запитав».',options:[['Зберегти повідомлення й оцінити, чи потрібне службове повідомлення','record'],['Видалити переписку, щоб не псувати стосунки','delete'],['Запропонувати законний спосіб отримати відкриту інформацію','route'],['Передати інформацію відповідальному за захист даних, якщо є ознаки інциденту','record']]},route:{chapter:'СЦЕНА 03',title:'Законний шлях',place:'08:54 · СЛУЖБОВИЙ КАБІНЕТ',body:'Ти пояснюєш, що службові бази не призначені для особистих перевірок, і пропонуєш користуватися лише законними процедурами отримання інформації.',options:[['Завершити розмову й зафіксувати обставини за потреби','record'],['Вважати, що інцидент не має значення','delete'],['Здійснити перевірку, бо знайомий наполягає','lookup'],['Попросити колегу допомогти неофіційно','delegate']]},lookup:{chapter:'СЦЕНА 03',title:'Один пошук',place:'08:55 · РОБОЧЕ МІСЦЕ',body:'Ти відкриваєш службову систему без службової потреби. Курсор завмирає над полем пошуку. Система може фіксувати дії користувача.',evidence:'ЖУРНАЛ ДОСТУПУ: час, обліковий запис і дія можуть бути збережені.',options:[['Зупинитися до перегляду даних і повідомити про ситуацію','stop'],['Продовжити та переказати результат знайомому','share'],['Зробити скриншот даних для себе','capture'],['Попросити колегу завершити пошук','delegate']]},basis:{chapter:'СЦЕНА 02',title:'Чи є підстава?',place:'08:52 · ТЕЛЕФОННА РОЗМОВА',body:'Ти запитуєш про правову підставу. Знайомий відповідає: «Це не для роботи, просто хочу знати». Жодного службового завдання немає.',options:[['Відмовити в неслужбовому доступі','refuse'],['Пояснити законний порядок звернення','route'],['Перевірити все одно','lookup'],['Передати прохання колезі','delegate'],['Уточнити, чи інформація є у відкритих джерелах','route']]},delegate:{chapter:'ФІНАЛ',title:'Чужими руками',place:'НАСТУПНОГО ДНЯ · ПЕРЕВІРКА',body:'Ти не відкрив базу самостійно, але попросив колегу зробити це без службової потреби. Таке доручення не робить запит правомірним.',ending:true,tags:['Обхід контролю','Неналежна мета'],analysis:'Передача неслужбового прохання колезі не створює законної підстави для обробки персональних даних.',law:'Закон України «Про захист персональних даних»: статті 6 і 10 — мета та умови обробки й використання персональних даних. За наявності службового доступу також перевіряються відомчі правила та обставини доручення.'},capture:{chapter:'ФІНАЛ',title:'Зайва копія',place:'09:06 · РОБОЧЕ МІСЦЕ',body:'Ти зберігаєш знімок екрана зі службовими відомостями без службової мети. Це створює додатковий ризик поширення даних.',ending:true,tags:['Копіювання даних','Ризик витоку'],analysis:'Копіювання персональних даних без визначеної правомірної мети може порушувати правила їх обробки та внутрішні вимоги безпеки.',law:'Закон України «Про захист персональних даних»: статті 6, 10 і, якщо дані передано третім особам, 14. Правова оцінка залежить від типу даних та обставин.'},stop:{chapter:'ФІНАЛ',title:'Вчасно зупинитися',place:'09:02 · ПІСЛЯ РОЗМОВИ',body:'Ти не продовжуєш неслужбовий пошук. Водночас сам факт відкриття системи без належної мети потребує оцінки за внутрішніми правилами. Ти вирішуєш не приховувати обставини.',ending:true,tags:['Зупинка ризикованої дії','Прозорість'],analysis:'Зупинення дії зменшує ризик, але попередні дії з доступом потребують окремої оцінки.',law:'Закон України «Про захист персональних даних», статті 6 і 10; внутрішні правила використання інформаційної системи. Саме відкриття системи не завжди є порушенням — важливі фактичні дії.'},share:{chapter:'ФІНАЛ',title:'Слід у системі',place:'НАСТУПНОГО ДНЯ · СЛУЖБОВА ПЕРЕВІРКА',body:'Знайомий отримує інформацію. Наступного дня виникають запитання щодо неслужбового доступу. Твоє рішення тепер оцінюють не за намірами, а за діями та наслідками.',ending:true,tags:['Неслужбовий доступ','Ризик розголошення'],analysis:'Неслужбовий перегляд і передавання даних можуть порушувати правила їх обробки. Можлива відповідальність визначається за конкретними обставинами, а не автоматично.',law:'Закон України «Про захист персональних даних», статті 6 (вимоги до обробки), 10 (використання), 14 (поширення). Додатково оцінюються правила доступу до відповідної системи.'},record:{chapter:'ФІНАЛ',title:'Межа, яку ти зберіг',place:'09:10 · КІНЕЦЬ ЕПІЗОДУ',body:'Ти не використовуєш службові дані для приватної мети. Знайомство залишилося знайомством, а службові повноваження — службовими повноваженнями.',ending:true,tags:['Доброчесність','Контроль доступу'],analysis:'Ти не використав службові повноваження для приватної мети. Питання фіксації звернення залежить від конкретних обставин.',law:'Закон України «Про захист персональних даних», статті 6 і 10: персональні дані обробляють і використовують із правомірною метою. Саме прохання знайомого не означає, що ти вчинив порушення.'},delete:{chapter:'ФІНАЛ',title:'Тиша не дорівнює безпеці',place:'09:12 · КІНЕЦЬ ЕПІЗОДУ',body:'Ти не надав інформацію, але вирішив не залишати слідів розмови. Згодом розумієш: бажання уникнути незручності не замінює належної оцінки інциденту.',ending:true,tags:['Відмова від доступу','Потреба оцінити інцидент'],analysis:'Не кожне прохання є правопорушенням, а видалення приватної розмови саме по собі не доводить порушення. Якщо виник інцидент, важливо дотримуватися встановленого порядку реагування.',law:'Закон України «Про захист персональних даних», статті 6 і 10; відповідні внутрішні процедури обліку та реагування на інциденти.'}};
let current=localStorage.getItem('corruptionGameSceneV2')||'intro';if(!scenes[current])current='intro';function show(id){current=id;localStorage.setItem('corruptionGameSceneV2',id);const s=scenes[id];document.getElementById('chapter').textContent=s.ending?'ФІНАЛ ІСТОРІЇ':'ЕПІЗОД 01';document.getElementById('place').textContent=s.place;document.getElementById('status').textContent=s.ending?'СПРАВУ ЗАВЕРШЕНО':'СПРАВА 001';document.getElementById('bar').style.width=({intro:5,call:24,why:42,refuse:62,route:62,lookup:62,stop:100,share:100,record:100,delete:100}[id]||10)+'%';let h='<div class="eyebrow">'+s.chapter+'</div><h1 class="title">'+s.title+'</h1><div class="story">'+s.body+'</div>';if(s.quote)h+='<div class="dialogue"><div class="speaker">'+s.speaker+'</div>'+s.quote+'</div>';if(s.evidence)h+='<div class="evidence"><strong>◈ ЗНАЙДЕНИЙ ДОКАЗ</strong><p>'+s.evidence+'</p></div>';if(s.ending){h+='<div class="evidence"><strong>РОЗБІР РІШЕННЯ</strong><p>'+s.analysis+'</p></div><div>'+s.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div><div class="choices"><button class="choice primary" onclick="show(\'intro\')">Пройти ще раз ↻</button></div>'}else{h+='<div class="choices">'+s.options.map(([label,next,kind],i)=>'<button class="choice '+(kind||'')+'" onclick="show(\''+next+'\')">'+(kind?'':String(i+1).padStart(2,'0')+' · ')+label+'</button>').join('')+'</div>'}if(id!=='intro')h+='<button class="restart" onclick="if(confirm(\'Почати історію спочатку?\'))show(\'intro\')">↶ Почати заново</button>';document.getElementById('content').innerHTML=h}show(current);
</script></body></html>

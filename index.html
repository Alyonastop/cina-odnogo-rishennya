const app=document.getElementById('app');
const KEY='cina_episode1_directors_v6';
const initial=()=>({step:'select',gender:null,chat:1,opened:[],marked:[],choice:null,second:null});
let state=initial();try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.step)state={...initial(),...s}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function go(step){state.step=step;save();render();window.scrollTo(0,0)}
function choose(g){state.gender=g;go('intro')}
function resetGame(){if(confirm('Почати історію спочатку?')){state=initial();go('select')}}
function frame(title,img){return `<div class="hero" style="background-image:url('${img}')"><h1>${title}</h1></div>`}
const photo=()=>IMG[state.gender==='man'?'man':'woman'];
const messages=[['Знайомий','Ти на роботі? Є прохання. Тільки між нами.','08:47'],['Ти','Що трапилося?','08:48'],['Знайомий','Можеш перевірити одну людину по службовій базі? Хочу укласти з нею угоду.','08:49'],['Ти','А яка службова підстава для такої перевірки?','08:50'],['Знайомий','Та не роби з цього проблему. Ніхто не дізнається. Я тобі віддячу.','08:51']];
const files=[['💬 Переписка','Знайомий називає приватну бізнесову мету. Слова «ніхто не дізнається» свідчать про тиск, але не доводять, що доступ до бази вже відбувся.'],['🔐 Підстава доступу','У цьому сюжеті немає службового доручення чи підтвердженої законної мети перевірки. Особисте знайомство не створює повноважень.'],['🕒 Журнал дій','Станом на 08:52 запитів до системи не здійснювали. Потрібно розрізняти прохання, намір, доступ до даних і їх передачу.'],['🎁 Обіцянка віддячити','Невизначена обіцянка поки не описує предмет, розмір або домовленість щодо вигоди. Для правової оцінки необхідні додаткові факти.']];
const claims=['Мета прохання — приватна, не службова.','Незаконний доступ до системи вже доведено.','Слова «віддячу» автоматично означають закінчений склад злочину.','Службової підстави для перевірки у матеріалах немає.'];
const options=['Перевірити особу в службовій базі й передати знайомому результат.','Відмовити й пояснити, чому службову базу не можна використовувати для приватних прохань.','Уточнити всі обставини, але не заходити до бази без належної підстави.','Порадити офіційний порядок звернення замість приватної перевірки.','Попросити колегу перевірити особу замість себе.','Не виконувати прохання, зберегти повідомлення та з’ясувати належний порядок реагування.'];
function showMessage(){state.chat=Math.min(5,state.chat+1);save();render()}
function toggleFile(i){state.opened=state.opened.includes(i)?state.opened.filter(x=>x!==i):[...state.opened,i];save();render()}
function mark(i){state.marked=state.marked.includes(i)?state.marked.filter(x=>x!==i):(state.marked.length>=2?[state.marked[1],i]:[...state.marked,i]);save();render()}
function decide(i){state.choice=i;go('consequence')}
function second(i){state.second=i;go('ending')}
function outcome(){switch(state.choice){case 0:return ['Слід у журналі','Ти здійснив запит без зазначеної у справі службової підстави та передав результат. У журналі системи з’явився запис. Правова кваліфікація залежить від конкретних даних, дій і повноважень.'];case 4:return ['Колега запитує про підстави','Ти передав приватне прохання колезі. Він відмовився без службового завдання. У цій гілці ніхто не відкривав базу, але твої дії можуть потребувати оцінки.'];case 2:return ['Знайомий посилює тиск','Ти розпитав про мету, проте не робив запиту. Знайомий зізнався, що хоче перевірити потенційного партнера для власного бізнесу.'];case 3:return ['Законний шлях — не гарантія доступу','Ти пояснив, що запити розглядаються за встановленими правилами. Це не означає, що захищені дані можна отримати навіть за офіційним зверненням.'];case 5:return ['Обачне реагування','Ти зберіг повідомлення, не робив перевірки та оцінив потребу діяти за процедурою. Саме прохання ще не доводить складу правопорушення.'];default:return ['Межу збережено','Ти відмовився використовувати службову інформацію для приватних цілей. Але знайомий не готовий прийняти відповідь.'];}}
function finale(){if(state.choice===0)return state.second===0?'Ти вирішив приховати виконаний запит. Це не прибирає запису і створює додаткові ризики.':'Ти не приховував факт доступу й обрав належний порядок повідомлення. Це не скасовує вчиненої дії.';if(state.choice===4)return state.second===0?'Ти знову тиснув на колегу; той відмовився, і запиту до бази не було.':'Ти припинив спробу отримати інформацію через колегу; запиту до бази не було.';return state.second===0?'Ти змінив рішення через тиск і все-таки зробив службовий запит без наведеної підстави. Ризик перетворився на дію.':'Ти не піддався тиску й не використовував службовий доступ для приватної мети.'}
function legal(){return `<div class="card legal"><h2>⚖ Правовий розбір</h2><p><b>Відокремлюємо факти від припущень:</b> прохання знайомого не дорівнює здійсненому доступу. Важливі мета, повноваження, вид даних, факт перегляду й передачі.</p><ul><li><b>Стаття 8 Закону «Про Національну поліцію»</b> — принцип законності.</li><li><b>Стаття 6 Закону «Про захист персональних даних»</b> — вимоги до обробки персональних даних, якщо йдеться про такі дані.</li><li><b>Стаття 28 Закону «Про інформацію»</b> — неприпустимість зловживання правом на інформацію.</li><li><b>Стаття 1 Закону «Про запобігання корупції»</b> — визначення неправомірної вигоди. Для застосування обмежень щодо подарунків (стаття 23) потрібні конкретні обставини, а не лише нечітка обіцянка «віддячити».</li><li><b>Стаття 182 КК України</b> може потребувати оцінки лише за наявності всіх ознак складу — не застосовується автоматично.</li></ul><p>Це навчальна схема, а не висновок про відповідальність. Перед офіційним використанням перевірте чинні редакції норм та внутрішні правила доступу.</p><a href="https://zakon.rada.gov.ua/laws/show/1700-18" target="_blank" rel="noopener">Закон про запобігання корупції</a> · <a href="https://zakon.rada.gov.ua/laws/show/580-19" target="_blank" rel="noopener">Закон про Національну поліцію</a></div>`}
function render(){let s='';if(state.step==='select')s=frame('Обери головного героя',IMG.office)+`<section class="content"><p class="eyebrow">ЕПІЗОД 01 · РЕЖИСЕРСЬКА ВЕРСІЯ</p><p class="lead">Одна особиста розмова. Кілька рішень. І наслідки, які відкриються не відразу.</p><div class="avatars"><button class="avatar" onclick="choose('woman')"><img src="${IMG.woman}" alt="Наша героїня"><span>♀ ЖІНКА</span></button><button class="avatar" onclick="choose('man')"><img src="${IMG.man}" alt="Наш герой"><span>♂ ЧОЛОВІК</span></button></div></section>`;
else if(state.step==='intro')s=frame('Невинне прохання',IMG.office)+`<section class="content"><p class="eyebrow">08:47 · СЛУЖБОВИЙ КАБІНЕТ</p><p class="lead">На столі — документи. Раптом телефон вібрує. Пише давній знайомий, якому ти колись обіцяв допомогти, якщо знадобиться.</p><button class="btn" onclick="go('chat')">Переглянути повідомлення →</button></section>`;
else if(state.step==='chat')s=`<section class="content"><p class="eyebrow">РОЗДІЛ 1 · ДІАЛОГ</p><h2>«Це тільки між нами»</h2><img class="scene" src="${photo()}" alt="Обраний персонаж читає повідомлення"><div class="card"><span class="pill">Знайомий · онлайн</span>${messages.slice(0,Math.max(1,state.chat)).map(([who,txt,t])=>`<div class="msg" style="${who==='Ти'?'margin-left:13%;background:#25547a':''}"><b>${who}</b><div>${txt}</div><span class="time">${t}</span></div>`).join('')}</div>${state.chat<5?`<button class="btn" onclick="showMessage()">${state.chat?'Наступне повідомлення':'Продовжити розмову'} →</button>`:`<button class="btn" onclick="go('evidence')">Дослідити докази →</button>`}</section>`;
else if(state.step==='evidence')s=`<section class="content"><p class="eyebrow">РОЗДІЛ 2 · РОЗСЛІДУВАННЯ</p><h2>Матеріали справи №001</h2><p>Знайди різницю між тим, що доведено, і тим, що можна лише припускати.</p>${files.map(([name,body],i)=>`<button class="evidence" onclick="toggleFile(${i})"><strong>${name} ${state.opened.includes(i)?'✓':''}</strong><small>${state.opened.includes(i)?'Натисни, щоб згорнути':'Відкрити матеріал'}</small></button>${state.opened.includes(i)?`<div class="detail">${body}</div>`:''}`).join('')}<div class="card">Досліджено: ${state.opened.length}/4</div><button class="btn" ${state.opened.length<4?'disabled':''} onclick="go('analysis')">Зіставити факти →</button></section>`;
else if(state.step==='analysis')s=`<section class="content"><p class="eyebrow">ДЕТЕКТИВНИЙ РЕЖИМ</p><h2>Яким висновкам можна довіряти?</h2><p>Обери <b>два</b> твердження, які підтверджені доказами.</p><div class="choices">${claims.map((c,i)=>`<button class="choice" style="${state.marked.includes(i)?'border-color:#e6b978;background:#28405a':''}" onclick="mark(${i})">${state.marked.includes(i)?'☑':'□'} ${c}</button>`).join('')}</div><div class="card">Обрано: ${state.marked.length}/2${state.marked.length===2?`<p>${state.marked.includes(0)&&state.marked.includes(3)?'✓ Правильно: доведено приватну мету, а службової підстави не наведено.':'Уважніше: прохання не доводить фактичного доступу, а нечітка обіцянка ще не встановлює складу правопорушення.'}</p>`:''}</div><button class="btn" ${state.marked.length!==2?'disabled':''} onclick="go('decision')">Ухвалити рішення →</button></section>`;
else if(state.step==='decision')s=`<section class="content"><p class="eyebrow">РОЗДІЛ 3 · ВИБІР</p><h2>«Ти мене підведеш?»</h2><p>Знайомий очікує відповіді. Твоє рішення визначить наступну сцену.</p><div class="choices">${options.map((o,i)=>`<button class="choice" onclick="decide(${i})"><span style="color:#e6b978">${i+1}.</span> ${o}</button>`).join('')}</div></section>`;
else if(state.step==='consequence'){let [title,txt]=outcome();s=`<section class="content"><p class="eyebrow">РОЗДІЛ 4 · НАСЛІДКИ</p><h2>${title}</h2><img class="scene" src="${photo()}" alt="Обраний герой"><div class="card">${txt}</div><p class="eyebrow">09:03 · ЗНАЙОМИЙ ПИШЕ ЗНОВУ</p><div class="msg">${state.choice===0?'Якщо хтось спитає, скажеш, що перевіряв по роботі?':state.choice===4?'То попроси колегу ще раз, я ж розраховую на тебе!':'Ти серйозно? Ми ж знайомі стільки років. Тобі важко зробити одну послугу?'}</div><button class="btn" onclick="go('second')">Відповісти на новий тиск →</button></section>`}
else if(state.step==='second'){let pairs=state.choice===0?['Спробувати приховати факт перевірки.','Не приховувати дії та обрати належний порядок повідомлення.']:state.choice===4?['Наполягати, щоб колега погодився.','Припинити прохання до колеги.']:['Змінити рішення й таки зробити перевірку.','Зберегти свою позицію та не користуватися службовим доступом.'];s=`<section class="content"><p class="eyebrow">РОЗДІЛ 5 · ПОВОРОТ</p><h2>Друге рішення</h2><p>Знайомий тисне сильніше. Що відповіси тепер?</p><div class="choices"><button class="choice" onclick="second(0)">01 · ${pairs[0]}</button><button class="choice" onclick="second(1)">02 · ${pairs[1]}</button></div></section>`}
else if(state.step==='ending')s=frame('Ціна рішення',IMG.office)+`<section class="content"><p class="eyebrow">ФІНАЛ · ЕПІЗОД 01</p><h2>${state.second===0?'Межа виявилася крихкою':'Ти побачив наслідки'}</h2><div class="card">${finale()}</div>${legal()}<button class="btn" onclick="go('decision')">Спробувати інший маршрут</button><button class="btn secondary" style="margin-top:10px" onclick="resetGame()">Почати гру заново</button></section>`;
app.innerHTML=s}
render();
</script></body></html>
